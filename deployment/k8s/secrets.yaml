apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: default
type: Opaque
stringData:
  database-url: "postgresql://user:password@postgres:5432/chatbot"
  redis-url: "redis://redis:6379/0"
  llm-api-key: "your-api-key"
  vectorstore-api-key: "your-vectorstore-key"
  secret-key: "your-secret-key"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: default
data:
  log_level: "INFO"
  max_conversation_history: "50"
  request_timeout: "30"
